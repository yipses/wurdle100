<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wurdle Infinity</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #121213;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #3a3a3c;
      padding: 12px 0;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #message {
      height: 28px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      background: #3a3a3c;
      padding: 4px 14px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s;
      margin-bottom: 16px;
    }

    #message.visible { opacity: 1; }

    #word-card {
      display: none;
      text-align: center;
      background: #1a1a1b;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
      max-width: 340px;
      width: 340px;
    }

    #word-card .wc-banner {
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #word-card.win  .wc-banner { background: #538d4e; }
    #word-card.lose .wc-banner { background: #b03a2e; }

    #word-card .wc-body {
      padding: 14px 20px;
    }

    #word-card .wc-word {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    #word-card .wc-zipf {
      font-size: 0.75rem;
      color: #818384;
      margin-bottom: 8px;
    }

    #word-card .wc-definition {
      font-size: 0.85rem;
      color: #d7dadc;
      line-height: 1.4;
      font-style: italic;
    }

    #play-again {
      display: none;
      margin-bottom: 16px;
      padding: 10px 24px;
      background: #538d4e;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #play-again:hover { background: #6aaf65; }

    #continue-btn {
      display: none;
      margin-bottom: 16px;
      padding: 10px 24px;
      background: #538d4e;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #continue-btn:hover { background: #6aaf65; }

    /* Grid */
    #board {
      display: grid;
      grid-template-rows: repeat(6, 62px);
      gap: 5px;
      margin-bottom: 24px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 62px);
      gap: 5px;
    }

    .tile {
      width: 62px;
      height: 62px;
      border: 2px solid #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      user-select: none;
      transition: border-color 0.05s;
    }

    .tile[data-letter] { border-color: #565758; }

    .tile.pop {
      animation: pop 0.1s ease;
    }

    .tile.shake {
      animation: shake 0.5s ease;
    }

    .tile.flip {
      animation: flip 0.5s ease forwards;
    }

    .tile.correct  { --bg: #538d4e; }
    .tile.present  { --bg: #b59f3b; }
    .tile.absent   { --bg: #8b2020; }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    @keyframes flip {
      0%   { transform: rotateX(0deg); background: transparent; border-color: #565758; color: #fff; }
      49%  { transform: rotateX(-90deg); background: transparent; }
      50%  { transform: rotateX(-90deg); background: var(--bg); border-color: var(--bg); }
      100% { transform: rotateX(0deg); background: var(--bg); border-color: var(--bg); }
    }

    /* Keyboard */
    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .kb-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .key {
      height: 58px;
      min-width: 43px;
      padding: 0 6px;
      border: none;
      border-radius: 4px;
      background: #818384;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation; /* removes 300ms tap delay on mobile */
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .key.wide { min-width: 65px; font-size: 0.75rem; }
    .key:active { filter: brightness(0.85); }

    /* Mobile keyboard — fits within iPhone screen */
    @media (max-width: 480px) {
      .key {
        height: 46px;
        min-width: 0;
        width: calc((100vw - 16px - 10 * 4px) / 11);
        font-size: 0.75rem;
        padding: 0;
        border-radius: 3px;
      }
      .key.wide {
        width: calc((100vw - 16px - 7 * 4px) / 8 * 1.4);
        font-size: 0.65rem;
      }
      .kb-row { gap: 4px; }
      #keyboard { gap: 5px; padding: 0 8px; }
      .tile { width: 52px; height: 52px; font-size: 1.6rem; }
      #board {
        grid-template-rows: repeat(6, 52px);
      }
      .row { grid-template-columns: repeat(5, 52px); }
    }

    .key.correct { background: #538d4e; }
    .key.present { background: #b59f3b; }
    .key.absent  { background: #8b2020; }

    #score-display {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #818384;
      margin-bottom: 12px;
    }

    #score-display .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    #score-display .stat-label { font-size: 0.65rem; color: #818384; }
    #score-display .stat-value { font-size: 1rem; color: #fff; }
    #score-display .hearts { font-size: 1.2rem; letter-spacing: 2px; }

    #loading {
      margin-top: 60px;
      font-size: 1rem;
      color: #818384;
      letter-spacing: 2px;
    }

    /* Score submission form */
    #score-form {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      width: 340px;
    }

    #score-form p { font-size: 0.85rem; color: #818384; }

    #score-form input {
      width: 100%;
      padding: 10px 14px;
      background: #1a1a1b;
      border: 1px solid #565758;
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
    }

    #score-form input:focus { border-color: #818384; }

    #score-form button {
      width: 100%;
      padding: 10px;
      background: #538d4e;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #score-form button:hover { background: #6aaf65; }
    #score-form button:disabled { background: #3a3a3c; cursor: default; }

    /* Leaderboard overlay */
    #leaderboard-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #leaderboard-overlay.open { display: flex; }

    #leaderboard-panel {
      background: #1a1a1b;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      width: 340px;
      overflow: hidden;
    }

    #leaderboard-panel .lb-header {
      background: #b59f3b;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
    }

    #leaderboard-list {
      padding: 12px 20px;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #3a3a3c;
      font-size: 0.9rem;
    }

    .lb-row:last-child { border-bottom: none; }
    .lb-rank { color: #818384; width: 24px; }
    .lb-name { flex: 1; padding: 0 8px; }
    .lb-score { font-weight: 700; color: #b59f3b; }

    #leaderboard-panel .lb-close {
      width: 100%;
      padding: 10px;
      background: #3a3a3c;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
    }

    #leaderboard-panel .lb-close:hover { background: #565758; }

    /* Footer */
    footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
    }

    footer a {
      color: #818384;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    footer a:hover { color: #fff; }
  </style>
</head>
<body>

<header><h1>Wurdle Infinity</h1></header>

<div id="score-display" style="display:none">
  <div class="stat"><span class="stat-label">Round</span><span class="stat-value" id="round-value">1</span></div>
  <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score-value">0</span></div>
  <div class="stat"><span class="stat-label">Bonus</span><span class="stat-value" id="bonus-value">+0%</span></div>
</div>
<div id="message"></div>
<div id="word-card">
  <div class="wc-banner"></div>
  <div class="wc-body">
    <div class="wc-word"></div>
    <div class="wc-zipf"></div>
    <div class="wc-definition"></div>
  </div>
</div>
<button id="continue-btn" onclick="resetGame()" style="display:none">Continue →</button>
<button id="play-again" onclick="resetGame(true)">Play Again</button>

<div id="score-form">
  <p>Enter your name to save your score</p>
  <input type="text" id="player-name" placeholder="Your name" maxlength="20" />
  <button onclick="submitHighScore()">Submit Score</button>
  <p id="submit-status"></p>
</div>

<div id="leaderboard-overlay">
  <div id="leaderboard-panel">
    <div class="lb-header">🏆 High Scores</div>
    <div id="leaderboard-list"></div>
    <button class="lb-close" onclick="closeLeaderboard()">Close</button>
  </div>
</div>

<div id="loading">Loading words…</div>

<div id="board" style="display:none">
  <!-- rows injected by JS -->
</div>

<div id="keyboard" style="display:none">
  <div class="kb-row" id="kb-row-1"></div>
  <div class="kb-row" id="kb-row-2"></div>
  <div class="kb-row" id="kb-row-3"></div>
</div>

<footer>
  <a href="#" onclick="openLeaderboard(); return false;">🏆 High Scores</a>
</footer>

<script>
  const SUPABASE_URL = 'https://eyollwbqfcumalskzawq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_lEe4zebfDfZagrzGgslI-A_4y5Efusr';

  const MIN_ZIPF    = 3.75;
  const POINTS      = [100, 90, 80, 60, 40, 20]; // points for guessing in 1–6 tries

  const ROWS = 6;
  const COLS = 5;

  const KB_ROWS = [
    ['Q','W','E','R','T','Y','U','I','O','P','⌫'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M','Enter'],
  ];

  let answer = '';
  let answerZipf = 0;
  let answerDefinition = '';
  let totalScore = 0;
  let currentRound = 1;
  let currentRow = 0;
  let currentCol = 0;
  let currentGuess = [];
  let gameOver = false;
  let locked = false;  // blocks input during validation + reveal animation
  let confirmedPositions = new Set(); // tracks already-green positions so points aren't awarded twice
  let tiles = [];   // tiles[row][col]

  // ── Supabase helpers ────────────────────────────────────────────────────────

  async function rpc(fn, params = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(params),
    });
    if (!res.ok) throw new Error(`Supabase error: ${res.status}`);
    return res.json();
  }

  async function fetchRandomWord() {
    const data = await rpc('get_random_word', { min_zipf: MIN_ZIPF });
    answer = data.word.toUpperCase();
    answerZipf = data.zipf;
    answerDefinition = data.definition || '';
  }

  async function isValidWord(guess) {
    return rpc('is_valid_word', { guess: guess.toLowerCase() });
  }

  async function submitScore(name, score) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal',
      },
      body: JSON.stringify({ name: name.trim(), score }),
    });
    return res.ok;
  }

  async function fetchTopScores() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/scores?select=name,score&order=score.desc&limit=10`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    return res.json();
  }

  // ── Build UI ────────────────────────────────────────────────────────────────

  function buildBoard() {
    const board = document.getElementById('board');
    tiles = [];
    for (let r = 0; r < ROWS; r++) {
      const row = document.createElement('div');
      row.className = 'row';
      const rowTiles = [];
      for (let c = 0; c < COLS; c++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        row.appendChild(tile);
        rowTiles.push(tile);
      }
      board.appendChild(row);
      tiles.push(rowTiles);
    }
  }

  function buildKeyboard() {
    KB_ROWS.forEach((keys, i) => {
      const rowEl = document.getElementById(`kb-row-${i + 1}`);
      keys.forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'key' + (k.length > 1 ? ' wide' : '');
        btn.textContent = k;
        btn.dataset.key = k;
        btn.addEventListener('click', () => handleKey(k));
        rowEl.appendChild(btn);
      });
    });
  }

  // ── Game logic ──────────────────────────────────────────────────────────────

  function handleKey(key) {
    if (gameOver || locked) return;

    if (key === '⌫' || key === 'Backspace') {
      deleteLetter();
    } else if (key === 'Enter') {
      submitGuess();
    } else if (/^[A-Za-z]$/.test(key)) {
      addLetter(key.toUpperCase());
    }
  }

  function addLetter(letter) {
    if (currentCol >= COLS) return;
    const tile = tiles[currentRow][currentCol];
    tile.textContent = letter;
    tile.dataset.letter = letter;
    tile.classList.add('pop');
    tile.addEventListener('animationend', () => tile.classList.remove('pop'), { once: true });
    currentGuess.push(letter);
    currentCol++;
  }

  function deleteLetter() {
    if (currentCol <= 0) return;
    currentCol--;
    currentGuess.pop();
    const tile = tiles[currentRow][currentCol];
    tile.textContent = '';
    delete tile.dataset.letter;
  }

  async function submitGuess() {
    if (currentCol < COLS) {
      shakeTiles();
      showMessage('Not enough letters');
      return;
    }

    locked = true;
    const guess = currentGuess.join('');
    showMessage('Checking…', 0);
    const valid = await isValidWord(guess);
    if (!valid) {
      shakeTiles();
      showMessage('Not in word list');
      locked = false;
      return;
    }
    showMessage('', 0);
    revealGuess(guess);
  }

  function revealGuess(guess) {
    const result = score(guess, answer);
    const row = tiles[currentRow];
    const delay = 350; // ms per tile

    result.forEach((state, i) => {
      const tile = row[i];
      setTimeout(() => {
        tile.style.animationDelay = '0ms'; // already handled by setTimeout
        tile.classList.add('flip', state);
        updateKey(guess[i], state);
      }, i * delay);
    });

    const totalDelay = COLS * delay;

    setTimeout(() => {
      // +5 pts per newly discovered green tile (bonus applied)
      let newCount = 0;
      result.forEach((s, i) => {
        if (s === 'correct' && !confirmedPositions.has(i)) {
          confirmedPositions.add(i);
          newCount++;
        }
      });
      if (newCount > 0) {
        const multiplier = 1 + (currentRound - 1) * 0.1;
        totalScore += Math.round(newCount * 5 * multiplier);
        updateScoreDisplay();
      }

      if (guess === answer) {
        gameOver = true;
        const base = POINTS[currentRow] ?? 20;
        const multiplier = 1 + (currentRound - 1) * 0.1;
        const earned = Math.round(base * multiplier);
        totalScore += earned;
        currentRound++;
        updateScoreDisplay();
        showWordCard(true, earned);
      } else if (currentRow === ROWS - 1) {
        gameOver = true;
        showWordCard('gameover', 0);
      }
      currentRow++;
      currentCol = 0;
      currentGuess = [];
      locked = false;
    }, totalDelay + 200);
  }

  // Returns array of 'correct' | 'present' | 'absent' for each position
  function score(guess, answer) {
    const result = Array(COLS).fill('absent');
    const answerArr = answer.split('');
    const guessArr = guess.split('');
    const used = Array(COLS).fill(false);

    // First pass: exact matches
    for (let i = 0; i < COLS; i++) {
      if (guessArr[i] === answerArr[i]) {
        result[i] = 'correct';
        used[i] = true;
        guessArr[i] = null; // mark consumed
      }
    }

    // Second pass: present but wrong position
    for (let i = 0; i < COLS; i++) {
      if (result[i] === 'correct') continue;
      for (let j = 0; j < COLS; j++) {
        if (!used[j] && guessArr[i] === answerArr[j]) {
          result[i] = 'present';
          used[j] = true;
          break;
        }
      }
    }

    return result;
  }

  // Priority: correct > present > absent — never downgrade a key
  const KEY_PRIORITY = { correct: 3, present: 2, absent: 1 };

  function updateKey(letter, state) {
    const btn = document.querySelector(`[data-key="${letter}"]`);
    if (!btn) return;
    const current = btn.className.match(/correct|present|absent/)?.[0];
    if (!current || KEY_PRIORITY[state] > KEY_PRIORITY[current]) {
      btn.classList.remove('correct', 'present', 'absent');
      btn.classList.add(state);
    }
  }

  function shakeTiles() {
    tiles[currentRow].forEach(t => {
      t.classList.add('shake');
      t.addEventListener('animationend', () => t.classList.remove('shake'), { once: true });
    });
  }

  function updateScoreDisplay() {
    document.getElementById('round-value').textContent = currentRound;
    document.getElementById('score-value').textContent = totalScore;
    const bonusPct = (currentRound - 1) * 10;
    document.getElementById('bonus-value').textContent = `+${bonusPct}%`;
  }

  function showWordCard(outcome, earned) {
    // outcome: true = win, false = lost a life, 'gameover' = no lives left
    const msgs = ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'];
    const card = document.getElementById('word-card');
    card.classList.remove('win', 'lose');

    let bannerText;
    if (outcome === true) {
      card.classList.add('win');
      bannerText = `${msgs[currentRow] || 'You got it!'} +${earned} pts`;
    } else {
      card.classList.add('lose');
      bannerText = `Game over! Final score: ${totalScore}`;
    }

    card.querySelector('.wc-banner').textContent = bannerText;
    card.querySelector('.wc-word').textContent = answer;
    card.querySelector('.wc-zipf').textContent = `Zipf score: ${answerZipf}`;
    card.querySelector('.wc-definition').textContent = answerDefinition || 'No definition available.';
    card.style.display = 'block';

    if (outcome === true) {
      const btn = document.getElementById('continue-btn');
      btn.style.display = 'inline-block';
      btn.focus();
    } else {
      // Game over — show score form
      const form = document.getElementById('score-form');
      document.getElementById('player-name').value = '';
      document.getElementById('submit-status').textContent = '';
      form.style.display = 'flex';
      document.getElementById('player-name').focus();
    }
  }

  async function submitHighScore() {
    const nameEl = document.getElementById('player-name');
    const statusEl = document.getElementById('submit-status');
    const btn = document.querySelector('#score-form button');
    const name = nameEl.value.trim();
    if (!name) { statusEl.textContent = 'Please enter your name.'; return; }

    btn.disabled = true;
    btn.textContent = 'Saving…';
    const ok = await submitScore(name, totalScore);
    if (ok) {
      statusEl.textContent = '✅ Score saved!';
      btn.textContent = 'Saved';
      setTimeout(() => {
        document.getElementById('score-form').style.display = 'none';
        document.getElementById('play-again').style.display = 'inline-block';
        document.getElementById('play-again').focus();
      }, 1000);
    } else {
      statusEl.textContent = '❌ Could not save. Try again.';
      btn.disabled = false;
      btn.textContent = 'Submit Score';
    }
  }

  async function openLeaderboard() {
    const overlay = document.getElementById('leaderboard-overlay');
    const list = document.getElementById('leaderboard-list');
    overlay.classList.add('open');
    list.innerHTML = '<div class="lb-row" style="justify-content:center;color:#818384">Loading…</div>';
    const scores = await fetchTopScores();
    if (!scores.length) {
      list.innerHTML = '<div class="lb-row" style="justify-content:center;color:#818384">No scores yet!</div>';
      return;
    }
    list.innerHTML = scores.map((s, i) => `
      <div class="lb-row">
        <span class="lb-rank">#${i + 1}</span>
        <span class="lb-name">${s.name}</span>
        <span class="lb-score">${s.score}</span>
      </div>`).join('');
  }

  function closeLeaderboard() {
    document.getElementById('leaderboard-overlay').classList.remove('open');
  }

  async function resetGame(resetScore = false) {
    // Pick a new word
    await fetchRandomWord();

    // Reset state
    currentRow = 0;
    currentCol = 0;
    currentGuess = [];
    gameOver = false;
    locked = false;
    confirmedPositions = new Set();
    if (resetScore) {
      totalScore = 0;
      currentRound = 1;
    }
    updateScoreDisplay();

    // Clear board
    const board = document.getElementById('board');
    board.innerHTML = '';
    buildBoard();

    // Reset keyboard colours
    document.querySelectorAll('.key').forEach(k => {
      k.classList.remove('correct', 'present', 'absent');
    });

    // Hide buttons, word card, score form and message
    document.getElementById('continue-btn').style.display = 'none';
    document.getElementById('play-again').style.display = 'none';
    document.getElementById('word-card').style.display = 'none';
    document.getElementById('score-form').style.display = 'none';
    const msg = document.getElementById('message');
    msg.classList.remove('visible');
  }

  let messageTimer;
  function showMessage(text, duration = 1800) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.classList.add('visible');
    clearTimeout(messageTimer);
    if (duration) {
      messageTimer = setTimeout(() => el.classList.remove('visible'), duration);
    }
  }

  // ── Init ────────────────────────────────────────────────────────────────────

  async function init() {
    try {
      await fetchRandomWord();

      document.getElementById('loading').remove();
      buildBoard();
      buildKeyboard();
      document.getElementById('board').style.display = '';
      document.getElementById('keyboard').style.display = '';
      document.getElementById('score-display').style.display = '';

      document.addEventListener('keydown', e => {
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        handleKey(e.key === 'Backspace' ? 'Backspace' : e.key);
      });
    } catch (err) {
      document.getElementById('loading').textContent = `Error: ${err.message}`;
      console.error(err);
    }
  }

  init();
</script>
</body>
</html>
