<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wurdle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #121213;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #3a3a3c;
      padding: 12px 0;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #message {
      height: 28px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      background: #3a3a3c;
      padding: 4px 14px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s;
      margin-bottom: 16px;
    }

    #message.visible { opacity: 1; }

    /* Grid */
    #board {
      display: grid;
      grid-template-rows: repeat(6, 62px);
      gap: 5px;
      margin-bottom: 24px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 62px);
      gap: 5px;
    }

    .tile {
      width: 62px;
      height: 62px;
      border: 2px solid #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      user-select: none;
      transition: border-color 0.05s;
    }

    .tile[data-letter] { border-color: #565758; }

    .tile.pop {
      animation: pop 0.1s ease;
    }

    .tile.shake {
      animation: shake 0.5s ease;
    }

    .tile.flip {
      animation: flip 0.5s ease forwards;
    }

    .tile.correct  { --bg: #538d4e; }
    .tile.present  { --bg: #b59f3b; }
    .tile.absent   { --bg: #3a3a3c; }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    @keyframes flip {
      0%   { transform: rotateX(0deg); background: transparent; border-color: #565758; color: #fff; }
      49%  { transform: rotateX(-90deg); background: transparent; }
      50%  { transform: rotateX(-90deg); background: var(--bg); border-color: var(--bg); }
      100% { transform: rotateX(0deg); background: var(--bg); border-color: var(--bg); }
    }

    /* Keyboard */
    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .kb-row {
      display: flex;
      gap: 6px;
    }

    .key {
      height: 58px;
      min-width: 43px;
      padding: 0 6px;
      border: none;
      border-radius: 4px;
      background: #818384;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .key.wide { min-width: 65px; font-size: 0.75rem; }
    .key:active { filter: brightness(0.85); }

    .key.correct { background: #538d4e; }
    .key.present { background: #b59f3b; }
    .key.absent  { background: #3a3a3c; }

    #loading {
      margin-top: 60px;
      font-size: 1rem;
      color: #818384;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<header><h1>Wurdle</h1></header>

<div id="message"></div>

<div id="loading">Loading words…</div>

<div id="board" style="display:none">
  <!-- rows injected by JS -->
</div>

<div id="keyboard" style="display:none">
  <div class="kb-row" id="kb-row-1"></div>
  <div class="kb-row" id="kb-row-2">
    <div style="width:22px"></div><!-- spacer -->
  </div>
  <div class="kb-row" id="kb-row-3"></div>
</div>

<script>
  const SUPABASE_URL = 'https://eyollwbqfcumalskzawq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_lEe4zebfDfZagrzGgslI-A_4y5Efusr';

  const ROWS = 6;
  const COLS = 5;

  const KB_ROWS = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Enter','Z','X','C','V','B','N','M','⌫'],
  ];

  let answer = '';
  let words = [];
  let currentRow = 0;
  let currentCol = 0;
  let currentGuess = [];
  let gameOver = false;
  let tiles = [];   // tiles[row][col]

  // ── Supabase fetch ──────────────────────────────────────────────────────────

  async function loadWords() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/words?select=word`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
        },
      }
    );

    if (!res.ok) throw new Error(`Supabase error: ${res.status}`);

    const data = await res.json();
    // Normalize to uppercase, keep only 5-letter words
    return data
      .map(r => (r.word || r.Word || '').toUpperCase().trim())
      .filter(w => w.length === COLS);
  }

  // ── Build UI ────────────────────────────────────────────────────────────────

  function buildBoard() {
    const board = document.getElementById('board');
    tiles = [];
    for (let r = 0; r < ROWS; r++) {
      const row = document.createElement('div');
      row.className = 'row';
      const rowTiles = [];
      for (let c = 0; c < COLS; c++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        row.appendChild(tile);
        rowTiles.push(tile);
      }
      board.appendChild(row);
      tiles.push(rowTiles);
    }
  }

  function buildKeyboard() {
    KB_ROWS.forEach((keys, i) => {
      const rowEl = document.getElementById(`kb-row-${i + 1}`);
      keys.forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'key' + (k.length > 1 ? ' wide' : '');
        btn.textContent = k;
        btn.dataset.key = k;
        btn.addEventListener('click', () => handleKey(k));
        rowEl.appendChild(btn);
      });
    });
  }

  // ── Game logic ──────────────────────────────────────────────────────────────

  function handleKey(key) {
    if (gameOver) return;

    if (key === '⌫' || key === 'Backspace') {
      deleteLetter();
    } else if (key === 'Enter') {
      submitGuess();
    } else if (/^[A-Za-z]$/.test(key)) {
      addLetter(key.toUpperCase());
    }
  }

  function addLetter(letter) {
    if (currentCol >= COLS) return;
    const tile = tiles[currentRow][currentCol];
    tile.textContent = letter;
    tile.dataset.letter = letter;
    tile.classList.add('pop');
    tile.addEventListener('animationend', () => tile.classList.remove('pop'), { once: true });
    currentGuess.push(letter);
    currentCol++;
  }

  function deleteLetter() {
    if (currentCol <= 0) return;
    currentCol--;
    currentGuess.pop();
    const tile = tiles[currentRow][currentCol];
    tile.textContent = '';
    delete tile.dataset.letter;
  }

  function submitGuess() {
    if (currentCol < COLS) {
      shakeTiles();
      showMessage('Not enough letters');
      return;
    }

    const guess = currentGuess.join('');
    revealGuess(guess);
  }

  function revealGuess(guess) {
    const result = score(guess, answer);
    const row = tiles[currentRow];
    const delay = 350; // ms per tile

    result.forEach((state, i) => {
      const tile = row[i];
      setTimeout(() => {
        tile.style.animationDelay = '0ms'; // already handled by setTimeout
        tile.classList.add('flip', state);
        updateKey(guess[i], state);
      }, i * delay);
    });

    const totalDelay = COLS * delay;

    setTimeout(() => {
      if (guess === answer) {
        gameOver = true;
        const msgs = ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'];
        showMessage(msgs[currentRow] || 'Nice!', 3000);
      } else if (currentRow === ROWS - 1) {
        gameOver = true;
        showMessage(answer, 4000);
      }
      currentRow++;
      currentCol = 0;
      currentGuess = [];
    }, totalDelay + 200);
  }

  // Returns array of 'correct' | 'present' | 'absent' for each position
  function score(guess, answer) {
    const result = Array(COLS).fill('absent');
    const answerArr = answer.split('');
    const guessArr = guess.split('');
    const used = Array(COLS).fill(false);

    // First pass: exact matches
    for (let i = 0; i < COLS; i++) {
      if (guessArr[i] === answerArr[i]) {
        result[i] = 'correct';
        used[i] = true;
        guessArr[i] = null; // mark consumed
      }
    }

    // Second pass: present but wrong position
    for (let i = 0; i < COLS; i++) {
      if (result[i] === 'correct') continue;
      for (let j = 0; j < COLS; j++) {
        if (!used[j] && guessArr[i] === answerArr[j]) {
          result[i] = 'present';
          used[j] = true;
          break;
        }
      }
    }

    return result;
  }

  // Priority: correct > present > absent — never downgrade a key
  const KEY_PRIORITY = { correct: 3, present: 2, absent: 1 };

  function updateKey(letter, state) {
    const btn = document.querySelector(`[data-key="${letter}"]`);
    if (!btn) return;
    const current = btn.className.match(/correct|present|absent/)?.[0];
    if (!current || KEY_PRIORITY[state] > KEY_PRIORITY[current]) {
      btn.classList.remove('correct', 'present', 'absent');
      btn.classList.add(state);
    }
  }

  function shakeTiles() {
    tiles[currentRow].forEach(t => {
      t.classList.add('shake');
      t.addEventListener('animationend', () => t.classList.remove('shake'), { once: true });
    });
  }

  let messageTimer;
  function showMessage(text, duration = 1800) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.classList.add('visible');
    clearTimeout(messageTimer);
    if (duration) {
      messageTimer = setTimeout(() => el.classList.remove('visible'), duration);
    }
  }

  // ── Init ────────────────────────────────────────────────────────────────────

  async function init() {
    try {
      words = await loadWords();
      if (words.length === 0) throw new Error('No 5-letter words found in the Words table.');

      answer = words[Math.floor(Math.random() * words.length)];

      document.getElementById('loading').remove();
      buildBoard();
      buildKeyboard();
      document.getElementById('board').style.display = '';
      document.getElementById('keyboard').style.display = '';

      document.addEventListener('keydown', e => {
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        handleKey(e.key === 'Backspace' ? 'Backspace' : e.key);
      });
    } catch (err) {
      document.getElementById('loading').textContent = `Error: ${err.message}`;
      console.error(err);
    }
  }

  init();
</script>
</body>
</html>
